<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S.</title>
<link rel="stylesheet" href="/web/style.css">
<link rel="manifest" href="/web/manifest.webmanifest">
<link rel="icon" href="/web/icon.svg">
<meta name="theme-color" content="#02070d">
<script>window.JARVIS_TOKEN = "__JARVIS_TOKEN__";</script>
</head>
<body>
<canvas id="graph"></canvas>
<div id="cursor" hidden></div>

<header id="top">
  <div class="dial"><span>J.A.R.V.I.S.</span><small id="mode">STANDBY</small></div>
  <nav id="filters"></nav>
  <div class="top-actions">
    <button id="voiceBtn" title="JARVIS speaks replies">🔊 Voice</button>
    <button id="camBtn" title="Hand-gesture control">✋ Camera</button>
    <button id="refreshBtn" title="Detect connected accounts">⟳ Accounts</button>
  </div>
</header>

<aside id="left" class="panel">
  <h2>Security <span id="secScore"></span></h2>
  <ul id="secChecks"></ul>
  <h2>Awaiting your OK</h2>
  <div id="pending"><p class="muted">Nothing waiting.</p></div>
  <h2>Activity log</h2>
  <ul id="audit"></ul>
</aside>

<aside id="right" class="panel">
  <div id="detail"><p class="muted">Tap a bubble, or pinch it with the camera on.</p></div>
  <div id="chat"></div>
  <form id="ask">
    <button type="button" id="micBtn" title="Speak">🎙</button>
    <input id="msg" autocomplete="off" placeholder="Ask JARVIS…">
    <button>Send</button>
  </form>
</aside>

<div id="camWrap" hidden><video id="cam" playsinline muted></video><canvas id="camOverlay"></canvas>
  <div id="gestureHint">☝ point · 🤏 pinch = select · pinch-drag = move · ✋ hold = reset · 🤏🤏 two hands = zoom</div></div>

<script src="/web/hud.js"></script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");</script>
<script type="module" src="/web/gestures.js"></script>
</body>
</html>
